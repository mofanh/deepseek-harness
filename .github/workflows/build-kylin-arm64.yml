name: Build Kylin ARM64 archive

# The branch builds an offline CLI archive with its embedded Web profile.
# Usage and target-machine acceptance are in .github/kylin-offline/README.txt.
on:
  push:
    branches: [build/kylin-arm64]

permissions:
  contents: read

concurrency:
  group: kylin-arm64-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  archive:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.pkg-cache
          key: pkg-fetch-node24-linux-arm64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pkg-fetch-node24-linux-arm64-

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux terminal addon for glibc 2.28
        run: |
          set -euo pipefail
          addon_dir="$(realpath packages/subprocess/subprocess-local/node_modules/node-pty)"
          pnpm_setup_root="$(realpath "$(dirname "$(dirname "$PNPM_HOME")")")"
          (cd "$addon_dir" && npm_config_build_from_source=true pnpm --config.verifyDepsBeforeRun=false run install)
          test -f "$addon_dir/build/Makefile"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:$PWD" \
            -v "$HOME/.cache/node-gyp:$HOME/.cache/node-gyp:ro" \
            -v "$pnpm_setup_root:$pnpm_setup_root:ro" \
            -w "$addon_dir" quay.io/pypa/manylinux_2_28_aarch64 \
            bash -euxo pipefail -c 'rm -rf build/Release && make -C build -j2 BUILDTYPE=Release'
          addon="$addon_dir/build/Release/pty.node"
          test -f "$addon"
          readelf --version-info "$addon" > node-pty-glibc-versions.txt
          maximum="$(sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' node-pty-glibc-versions.txt | sort -V | tail -1)"
          test -n "$maximum"
          dpkg --compare-versions "$maximum" le 2.28

      - name: Build standalone CLI and Web assets
        run: pnpm exec tsx scripts/build-exe-for-python-sdk.ts --targets=node24-linux-arm64

      - name: Check executable glibc requirements
        run: |
          set -euo pipefail
          executable=dist-exe/deepseek-harness-sdk-runtime-linux-arm64
          test -x "$executable"
          readelf --version-info "$executable" > executable-glibc-versions.txt
          maximum="$(sed -n 's/.*Name: GLIBC_\([0-9.]*\).*/\1/p' executable-glibc-versions.txt | sort -V | tail -1)"
          test -n "$maximum"
          dpkg --compare-versions "$maximum" le 2.28

      - name: Assemble offline archive
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          name="dsh-kylin-arm64-$version"
          stage="$RUNNER_TEMP/$name"
          runtime="$stage/app/deepseek_harness_runtime/runtime"
          mkdir -p "$runtime" dist-offline
          cp dist-exe/deepseek-harness-sdk-runtime-linux-arm64 "$runtime/"
          cp dist-exe/deepseek-harness-sdk-runtime-linux-arm64-rg "$runtime/"
          cp -R dist-exe/linux-arm64 "$runtime/"
          cp .github/kylin-offline/start.sh .github/kylin-offline/doctor.sh "$stage/"
          cp .github/kylin-offline/README.txt "$stage/使用说明.txt"
          cp LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          chmod +x "$stage/start.sh" "$stage/doctor.sh" "$runtime"/deepseek-harness-sdk-runtime-linux-arm64*
          STAGE="$stage" VERSION="$version" python3 - <<'PY'
          import json, os
          from pathlib import Path
          stage = Path(os.environ['STAGE'])
          info = {
              'version': os.environ['VERSION'],
              'source_sha': os.environ['GITHUB_SHA'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'platform': 'linux-arm64',
              'glibc_minimum': '2.28',
              'local_runtime_tests': 'not-performed',
          }
          (stage / 'build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          readme = stage / '使用说明.txt'
          content = readme.read_text()
          for key, value in {'__VERSION__': info['version'], '__SOURCE_SHA__': info['source_sha'], '__RUN_URL__': info['run_url']}.items():
              content = content.replace(key, value)
          readme.write_text(content)
          PY
          (cd "$stage" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          tar -C "$RUNNER_TEMP" -czf "dist-offline/$name.tar.gz" "$name"
          (cd dist-offline && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          cp "$stage/build-info.json" dist-offline/
          printf 'ARCHIVE_NAME=%s\n' "$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist-offline/
          if-no-files-found: error
          retention-days: 14
